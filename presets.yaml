# Edit this file to define which TTS combos you want to compare.
# Each entry shows up as a checkbox on the page.
#
# `language` is optional (ISO 639-1, e.g. fr, en, de).
#   - ElevenLabs: passed as `language_code` (forces, errors if model doesn't support it).
#   - Cartesia:   passed as `language`.
#   - OpenAI:     ignored (no language param on /v1/audio/speech, auto-detect only).
# Omit the field to use each provider's auto-detection.

