<div class="card done" id="card-{{ preset.id }}">
  <div class="card-header">{{ preset.label }}</div>
  <audio src="/audio/{{ session_id }}/{{ preset.id }}.{{ ext }}" controls preload="auto"></audio>
  <div class="card-footer">
    <span class="latency">{{ latency_ms }} ms</span>
    <a class="download"
       href="/audio/{{ session_id }}/{{ preset.id }}.{{ ext }}"
       download="{{ preset.id }}.{{ ext }}">↓ DL</a>
  </div>
</div>
