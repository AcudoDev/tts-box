<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>TTS Box</title>
  <!-- Anti-FOUC: apply the saved theme BEFORE the stylesheet paints.
       Absent / invalid value = follow the OS (prefers-color-scheme). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tts_box_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- Brand favicon (box + cyan equalizer) as a data-URI so the browser
       never requests /favicon.ico (that route stays as a 204 no-op). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20x='2.5'%20y='2.5'%20width='19'%20height='19'%20rx='5'%20fill='none'%20stroke='%230891b2'%20stroke-width='2'/%3E%3Cg%20fill='%230891b2'%3E%3Crect%20x='7'%20y='10'%20width='2.4'%20height='7'%20rx='1.2'/%3E%3Crect%20x='10.8'%20y='6.5'%20width='2.4'%20height='10.5'%20rx='1.2'/%3E%3Crect%20x='14.6'%20y='12'%20width='2.4'%20height='5'%20rx='1.2'/%3E%3C/g%3E%3C/svg%3E" />
  <!-- flag-icons (lipis) — MIT licensed SVG country flags, render on every OS incl. Windows -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7/css/flag-icons.min.css" />
  <!-- Inter + JetBrains Mono (Google Fonts, display=swap). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}" />
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="2" />
        <g fill="currentColor">
          <rect x="7" y="10" width="2.4" height="7" rx="1.2" />
          <rect x="10.8" y="6.5" width="2.4" height="10.5" rx="1.2" />
          <rect x="14.6" y="12" width="2.4" height="5" rx="1.2" />
        </g>
      </svg>
      <div class="brand-text">
        <h1>TTS Box</h1>
        <p class="tagline">Compare TTS providers side-by-side</p>
      </div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-label="Toggle color theme" aria-pressed="false" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </header>

  <main>
    <form id="gen-form" hx-post="/generate" hx-target="#results" hx-swap="innerHTML">
      <div class="lang-row">
        <label for="lang-select">Language</label>
        <select id="lang-select" name="language"
                hx-get="/voices" hx-target="#voices" hx-swap="innerHTML"
                hx-trigger="change">
          {% for code, name in languages %}
            <option value="{{ code }}" {% if code == current_lang %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
        <button type="button" class="link-btn" id="refresh-voices"
                hx-get="/voices?refresh=true" hx-target="#voices" hx-swap="innerHTML"
                hx-include="#lang-select">↻ refresh voices</button>
      </div>

      <label class="field-label" for="text-input">Text to synthesize</label>
      <textarea id="text-input" name="text" required autofocus rows="4"
                placeholder="Type or paste your text here…" aria-describedby="text-meta">{{ sample_text }}</textarea>
      <p class="text-meta" id="text-meta"><span id="char-count">{{ sample_text|length }}</span> characters<span class="shortcut-hint">
        · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to generate</span></p>

      <div class="voices-header">
        <div class="voices-title">
          <h2>Voices to compare</h2>
          <span class="voices-summary"><span id="count">0</span> selected</span>
        </div>
        <div class="voices-actions">
          <button type="button" class="link-btn" data-toggle-all="true">Check all</button>
          <span class="sep">·</span>
          <button type="button" class="link-btn" data-toggle-all="false">Uncheck all</button>
          <span class="sep">·</span>
          <button type="button" class="link-btn" id="save-fav">★ Save selection</button>
        </div>
      </div>

      <div id="voices">
        {% include "_voices.html" %}
      </div>

      <div class="generate-bar">
        <button type="submit" class="generate-btn" id="generate-btn" disabled>
          Generate (<span id="count-cta">0</span>)
        </button>
      </div>
    </form>

    <div id="results-head" class="results-head" hidden tabindex="-1">
      <h2 class="results-title" id="results-title"></h2>
      <p class="results-status" id="results-status" aria-live="polite"></p>
    </div>
    <section id="results" role="region" aria-live="polite" aria-label="Comparison results"></section>
  </main>

  <script>
    const form = document.getElementById("gen-form");
    const LANG = document.getElementById("lang-select");

    const generateBtn = document.getElementById("generate-btn");

    function updateCounts() {
      const checked = form.querySelectorAll('input[name="selected"]:checked').length;
      document.getElementById("count").textContent = checked;
      const cta = document.getElementById("count-cta");  // absent while "Generating N…"
      if (cta) cta.textContent = checked;
      // Sticky Generate bar: dim + disable when nothing is selected (N=0) or in flight.
      generateBtn.disabled = checked === 0 || generateBtn.hasAttribute("aria-busy");
      form.querySelectorAll('.provider-group').forEach(group => {
        const sel = group.querySelectorAll('input[name="selected"]:checked').length;
        const out = group.querySelector('.provider-checked');
        if (out) out.textContent = sel;
        group.classList.toggle('has-selection', sel > 0);
      });
      // Checked-row tint fallback for engines without :has().
      form.querySelectorAll('#voices .preset').forEach(label => {
        const cb = label.querySelector('input[name="selected"]');
        label.classList.toggle('is-checked', !!cb && cb.checked);
      });
    }

    // Favoris : tokens provider|model|voice en localStorage.
    function favorites() {
      try { return JSON.parse(localStorage.getItem("tts_box_favorites") || "[]"); }
      catch { return []; }
    }
    function applyFavorites() {
      const favs = new Set(favorites());
      form.querySelectorAll('input[name="selected"]').forEach(cb => {
        if (favs.has(cb.value)) cb.checked = true;
      });
      updateCounts();
    }

    // Recherche + filtre genre (sur le bloc #voices courant).
    // Hide rows that don't match; then hide any .model-group / provider <details>
    // that ends up with zero visible rows, surface a "No voices match…" message,
    // and refresh the "Showing N of M" toolbar count + per-provider shown counts.
    function applyFilters() {
      const q = (document.getElementById("voice-search")?.value || "").toLowerCase();
      const g = document.getElementById("gender-filter")?.value || "";
      const rows = form.querySelectorAll('#voices .preset');
      let shown = 0;
      const total = rows.length;
      rows.forEach(label => {
        const name = label.dataset.name || "";
        const gender = label.dataset.gender || "";
        const ok = name.includes(q) && (!g || gender === g);
        label.hidden = !ok;
        if (ok) shown++;
      });

      // Collapse empty model sub-groups.
      form.querySelectorAll('#voices .model-group').forEach(mg => {
        const any = mg.querySelector('.preset:not([hidden])');
        mg.hidden = !any;
      });

      // Hide whole providers with no visible rows; refresh their shown count.
      form.querySelectorAll('#voices .provider-group').forEach(group => {
        const visible = group.querySelectorAll('.preset:not([hidden])').length;
        group.hidden = visible === 0;
        const out = group.querySelector('.provider-shown');
        if (out) out.textContent = visible;
      });

      // "Showing N of M" + global empty state.
      const shownOut = document.getElementById("voices-shown");
      if (shownOut) shownOut.textContent = "Showing " + shown + " of " + total;
      const emptyOut = document.getElementById("voices-empty");
      if (emptyOut) emptyOut.hidden = !(total > 0 && shown === 0);
    }

    // Délégation : marche aussi après un swap HTMX de #voices.
    document.addEventListener("input", (e) => {
      if (e.target.id === "voice-search") applyFilters();
      if (e.target.name === "selected") updateCounts();
      if (e.target.id === "text-input") updateCharCount();
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "gender-filter") applyFilters();
    });
    // A checkbox is "visible" when it passes the current search/gender filter,
    // i.e. neither its row nor its model-group / provider-group is [hidden].
    // (A collapsed <details> is NOT hidden — those voices still count and submit.)
    function isFilterVisible(cb) {
      const row = cb.closest('.preset');
      if (!row || row.hidden) return false;
      const mg = cb.closest('.model-group');
      if (mg && mg.hidden) return false;
      const pg = cb.closest('.provider-group');
      if (pg && pg.hidden) return false;
      return true;
    }
    function visibleInputs(root) {
      return Array.from((root || form).querySelectorAll('#voices input[name="selected"]'))
        .filter(isFilterVisible);
    }
    form.addEventListener("click", (e) => {
      if (e.target.matches('[data-toggle-all]')) {
        // Scope Check-all / Uncheck-all to the FILTERED (currently-visible) set only.
        const t = e.target.dataset.toggleAll === "true";
        visibleInputs().forEach(cb => { cb.checked = t; });
        updateCounts();
      }
      if (e.target.matches('[data-toggle-provider]')) {
        // The button lives inside <summary>; stop the click from toggling the
        // <details> open/closed. Act on this provider's visible inputs only.
        e.preventDefault();
        const group = e.target.closest('.provider-group');
        const boxes = visibleInputs(group);
        const allChecked = boxes.length > 0 && boxes.every(cb => cb.checked);
        boxes.forEach(cb => { cb.checked = !allChecked; });
        updateCounts();
      }
      if (e.target.id === "save-fav") {
        const sel = Array.from(form.querySelectorAll('input[name="selected"]:checked')).map(cb => cb.value);
        localStorage.setItem("tts_box_favorites", JSON.stringify(sel));
        e.target.textContent = "★ Saved";
        setTimeout(() => { e.target.textContent = "★ Save selection"; }, 1200);
      }
    });

    // Sample texts per language — injected server-side, consumed here only.
    const SAMPLE_TEXTS = {{ sample_texts | tojson }};
    const textarea = document.getElementById("text-input");
    const charCount = document.getElementById("char-count");
    function updateCharCount() { charCount.textContent = textarea.value.length; }

    function updateSampleText(lang) {
      const sample = SAMPLE_TEXTS[lang] || SAMPLE_TEXTS["en"];
      // Only replace if the textarea still holds a known sample text (not custom input).
      const current = textarea.value.trim();
      const isDefault = Object.values(SAMPLE_TEXTS).some(t => t.trim() === current) || current === "";
      if (isDefault) { textarea.value = sample; updateCharCount(); }
    }

    // Persistance de la langue + ré-application favoris/compteurs après chaque swap de #voices.
    const savedLang = localStorage.getItem("tts_box_lang");
    if (savedLang && savedLang !== LANG.value && [...LANG.options].some(o => o.value === savedLang)) {
      LANG.value = savedLang;
      htmx.ajax("GET", "/voices?language=" + encodeURIComponent(savedLang), {target: "#voices", swap: "innerHTML"});
      updateSampleText(savedLang);
    }
    LANG.addEventListener("change", () => {
      localStorage.setItem("tts_box_lang", LANG.value);
      updateSampleText(LANG.value);
    });

    // Results separation: a heading that announces "Comparing N voices" and a live
    // "X done · Y failed" tally. The card grid (#results) is innerHTML-swapped by the
    // form POST; each card then replaces itself (done/error) and its swap bubbles here.
    const resultsHead = document.getElementById("results-head");
    const resultsTitle = document.getElementById("results-title");
    const resultsStatus = document.getElementById("results-status");
    function updateResultsHead() {
      const root = document.getElementById("results");
      const total = root.querySelectorAll('.card').length;
      if (total === 0) { resultsHead.hidden = true; return; }
      const done = root.querySelectorAll('.card.done').length;
      const failed = root.querySelectorAll('.card.error').length;
      resultsHead.hidden = false;
      resultsTitle.textContent = "Comparing " + total + (total === 1 ? " voice" : " voices");
      resultsStatus.textContent = done + " done · " + failed + " failed";
    }

    // Set when the form POST starts; consumed by the first #results swap so we
    // reveal + scroll the heading exactly once (card self-swaps also bubble here).
    let pendingResultsScroll = false;
    document.body.addEventListener("htmx:afterSwap", (e) => {
      if (e.target.id === "voices") { applyFilters(); applyFavorites(); }
    });
    // Tally on afterSettle, not afterSwap: a card swapped in place (same id) keeps its
    // old class="card loading" until htmx settles, which undercounted "done".
    // Scroll only on the first swap of a generation.
    document.body.addEventListener("htmx:afterSettle", (e) => {
      if (e.target.id === "results" || (e.target.closest && e.target.closest("#results"))) {
        updateResultsHead();
        if (pendingResultsScroll) {
          pendingResultsScroll = false;
          resultsHead.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    });

    // While /generate is in flight: mark the button busy ("Generating N…") and
    // disable it so a second tap can't fire a duplicate session. Restore after.
    form.addEventListener("htmx:beforeRequest", (e) => {
      if (e.target !== form) return; // ignore card/voices sub-requests
      pendingResultsScroll = true; // first #results swap will scroll the heading into view
      const n = form.querySelectorAll('input[name="selected"]:checked').length;
      generateBtn.setAttribute("aria-busy", "true");
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating " + n + "…";
    });
    function endGenerate() {
      generateBtn.removeAttribute("aria-busy");
      generateBtn.innerHTML = 'Generate (<span id="count-cta">0</span>)';  // updateCounts fills it
      updateCounts();
    }
    form.addEventListener("htmx:afterRequest", (e) => { if (e.target === form) endGenerate(); });

    textarea.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); form.requestSubmit(); }
    });

    // Theme toggle: cycle system → light → dark → system, persist, reflect aria-pressed.
    // Reuses the localStorage pattern (tts_box_lang / tts_box_favorites). The anti-FOUC
    // head script already applied the saved value to <html data-theme> before paint.
    const THEME_KEY = "tts_box_theme";
    const themeBtn = document.getElementById("theme-toggle");
    function applyTheme(mode) {
      if (mode === "light" || mode === "dark") {
        document.documentElement.dataset.theme = mode;
        try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
      } else {
        delete document.documentElement.dataset.theme;
        try { localStorage.removeItem(THEME_KEY); } catch (e) {}
      }
      const forced = mode === "light" || mode === "dark";
      themeBtn.setAttribute("aria-pressed", forced ? "true" : "false");
      themeBtn.title = "Theme: " + (forced ? mode : "system");
    }
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.dataset.theme || "system";
      const next = cur === "system" ? "light" : cur === "light" ? "dark" : "system";
      applyTheme(next);
    });
    // Sync button state with whatever the head script already set.
    applyTheme(document.documentElement.dataset.theme || "system");

    applyFavorites();
    applyFilters();
    updateCounts();
  </script>
</body>
</html>
