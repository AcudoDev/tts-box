<div class="card error" id="card-{{ option.id }}">
  <div class="card-header">
    <span class="card-voice">{{ option.label }}</span>
    <span class="card-meta">{{ option.provider }} · {{ option.model }}</span>
  </div>
  <div class="card-body">❌ {{ error_msg }}</div>
  {% if latency_ms %}<div class="card-footer"><span class="latency">{{ latency_ms }} ms</span></div>{% endif %}
</div>
